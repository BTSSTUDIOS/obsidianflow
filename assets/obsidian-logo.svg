<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="200" height="240" fill="none">
  <defs>
    <!-- Obsidian Black Facet Gradients -->
    <linearGradient id="obsidianMainLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181424"/>
      <stop offset="40%" stop-color="#0a0812"/>
      <stop offset="100%" stop-color="#030206"/>
    </linearGradient>
    <linearGradient id="obsidianMainRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#241e34"/>
      <stop offset="40%" stop-color="#100d1c"/>
      <stop offset="100%" stop-color="#040308"/>
    </linearGradient>

    <!-- Top Cap Facet Gradients -->
    <linearGradient id="topCapLeft" x1="50%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4a3e68"/>
      <stop offset="50%" stop-color="#1e182e"/>
      <stop offset="100%" stop-color="#0e0b16"/>
    </linearGradient>
    <linearGradient id="topCapRight" x1="50%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6b5b94"/>
      <stop offset="40%" stop-color="#2a223e"/>
      <stop offset="100%" stop-color="#120e1c"/>
    </linearGradient>

    <!-- Glowing Purple Obsidian Refraction Gradients (Matching Reference) -->
    <linearGradient id="purpleGlowBottomLeft" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d8b4fe"/>
      <stop offset="35%" stop-color="#a855f7"/>
      <stop offset="70%" stop-color="#6b21a8"/>
      <stop offset="100%" stop-color="#2e1065"/>
    </linearGradient>
    <linearGradient id="purpleGlowBottomRight" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#e9d5ff"/>
      <stop offset="30%" stop-color="#c084fc"/>
      <stop offset="65%" stop-color="#7e22ce"/>
      <stop offset="100%" stop-color="#3b0764"/>
    </linearGradient>
    <linearGradient id="purpleGlowEdge" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#9333ea"/>
      <stop offset="100%" stop-color="#581c87"/>
    </linearGradient>

    <!-- Specular White Rim Highlight -->
    <linearGradient id="rimSpecular" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.85)"/>
      <stop offset="40%" stop-color="rgba(255,255,255,0.3)"/>
      <stop offset="100%" stop-color="rgba(216,180,254,0.6)"/>
    </linearGradient>

    <!-- Purple Internal Neon Glow Filter -->
    <filter id="purpleBloom" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Obsidian Canvas Backdrop -->
  <rect width="200" height="240" rx="40" fill="#030305"/>
  <rect width="198" height="238" x="1" y="1" rx="39" stroke="rgba(255,255,255,0.06)" stroke-width="1.5"/>

  <!-- Ambient Purple Halo behind crystal -->
  <circle cx="100" cy="180" r="45" fill="rgba(168, 85, 247, 0.22)" filter="url(#purpleBloom)"/>

  <!-- ================= CRYSTAL FACETS ================= -->
  
  <!-- 1. Top Point Pyramid Facets -->
  <!-- Top Left Facet -->
  <polygon points="100,16 62,64 100,82" fill="url(#topCapLeft)"/>
  <!-- Top Right Facet -->
  <polygon points="100,16 138,64 100,82" fill="url(#topCapRight)"/>
  <!-- Top Far Left Outer Facet -->
  <polygon points="100,16 62,64 56,84" fill="#1b1528"/>
  <!-- Top Far Right Outer Facet -->
  <polygon points="100,16 138,64 144,84" fill="#2d2342"/>

  <!-- 2. Main Vertical Column Facets (Onyx Mirror Black) -->
  <!-- Main Left Column -->
  <polygon points="62,64 100,82 100,160 62,176" fill="url(#obsidianMainLeft)"/>
  <!-- Main Right Column -->
  <polygon points="138,64 100,82 100,160 138,176" fill="url(#obsidianMainRight)"/>

  <!-- Outer Side Vertical Bevels (with Subtle Purple Glass Sheen) -->
  <!-- Far Left Bevel -->
  <polygon points="56,84 62,64 62,176 56,160" fill="#161026"/>
  <polygon points="56,84 62,64 62,176 56,160" fill="url(#purpleGlowEdge)" opacity="0.35"/>
  <!-- Far Right Bevel -->
  <polygon points="144,84 138,64 138,176 144,160" fill="#201734"/>
  <polygon points="144,84 138,64 138,176 144,160" fill="url(#purpleGlowEdge)" opacity="0.45"/>

  <!-- 3. Bottom Tapering Pyramid Facets (Glowing Purple Refraction from reference) -->
  <!-- Bottom Left Glowing Purple Facet -->
  <polygon points="62,176 100,160 100,224" fill="url(#purpleGlowBottomLeft)"/>
  <!-- Bottom Right Glowing Purple Facet -->
  <polygon points="138,176 100,160 100,224" fill="url(#purpleGlowBottomRight)"/>
  <!-- Bottom Far Left Corner Facet -->
  <polygon points="56,160 62,176 100,224" fill="#581c87" opacity="0.85"/>
  <!-- Bottom Far Right Corner Facet -->
  <polygon points="144,160 138,176 100,224" fill="#7e22ce" opacity="0.9"/>

  <!-- ================= SPECULAR GLASS BEVELS & RIDGES ================= -->
  <!-- Outer Perimeter Glass Outline -->
  <polygon
    points="100,16 138,64 144,84 144,160 138,176 100,224 62,176 56,160 56,84 62,64"
    stroke="url(#rimSpecular)"
    stroke-width="1.6"
    stroke-linejoin="round"
  />

  <!-- Internal Facet Edge Ridges (Crisp Platinum & Violet Glints) -->
  <!-- Center Vertical Ridge -->
  <line x1="100" y1="82" x2="100" y2="160" stroke="rgba(255,255,255,0.7)" stroke-width="1.8"/>
  <!-- Upper V Ridge -->
  <polyline points="62,64 100,82 138,64" stroke="rgba(255,255,255,0.55)" stroke-width="1.4"/>
  <!-- Lower V Ridge -->
  <polyline points="62,176 100,160 138,176" stroke="rgba(233,213,255,0.85)" stroke-width="1.6"/>
  <!-- Bottom Inverted Ridge -->
  <line x1="100" y1="160" x2="100" y2="224" stroke="#f3e8ff" stroke-width="1.8"/>
  <!-- Top Apex Ridge -->
  <line x1="100" y1="16" x2="100" y2="82" stroke="rgba(255,255,255,0.7)" stroke-width="1.2"/>
</svg>
