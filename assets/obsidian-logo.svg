<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <!-- Obsidian Amethyst Gradients -->
    <linearGradient id="obsidianTable" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f3e8ff"/>
      <stop offset="100%" stop-color="#d8b4fe"/>
    </linearGradient>

    <linearGradient id="obsidianCrown" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <linearGradient id="obsidianInner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333ea"/>
      <stop offset="100%" stop-color="#6b21a8"/>
    </linearGradient>

    <linearGradient id="obsidianOuter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7e22ce"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>
  </defs>

  <!-- Facets Group -->
  <g stroke="#090514" stroke-width="1.8" stroke-linejoin="round">
    <!-- Left Wing (Obsidian Facets) -->
    <polygon points="34,26 60,54 44,54" fill="url(#obsidianCrown)"/>
    <polygon points="34,26 12,54 44,54" fill="url(#obsidianOuter)"/>
    <polygon points="12,54 44,54 60,114" fill="#3b0764"/>
    <polygon points="44,54 60,54 60,114" fill="url(#obsidianInner)"/>

    <!-- Center Table Facet -->
    <polygon points="34,26 86,26 60,54" fill="url(#obsidianTable)"/>

    <!-- Right Wing (Obsidian Facets) -->
    <polygon points="86,26 60,54 76,54" fill="#c084fc"/>
    <polygon points="86,26 76,54 108,54" fill="url(#obsidianCrown)"/>
    <polygon points="60,54 76,54 60,114" fill="url(#obsidianInner)"/>
    <polygon points="76,54 108,54 60,114" fill="url(#obsidianOuter)"/>
  </g>

  <!-- Specular Center Spine & Crown Highlights -->
  <line x1="60" y1="26" x2="60" y2="114" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="34" y1="26" x2="86" y2="26" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
</svg>
