<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 140" width="120" height="140" fill="none">
  <defs>
    <!-- Drop Shadow / Glow -->
    <filter id="pureSpearShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="rgba(147, 51, 234, 0.4)"/>
    </filter>
  </defs>

  <g filter="url(#pureSpearShadow)">
    <!-- Left Facet Upper: Deep Royal Violet -->
    <polygon points="60,12 24,70 60,94" fill="#7e22ce" stroke="#0e0717" stroke-width="1.6" stroke-linejoin="round"/>
    <!-- Left Facet Base: Midnight Obsidian -->
    <polygon points="24,70 42,118 60,94" fill="#4c1d95" stroke="#0e0717" stroke-width="1.6" stroke-linejoin="round"/>

    <!-- Right Facet Upper: Bright Lavender Purple -->
    <polygon points="60,12 96,70 60,94" fill="#c084fc" stroke="#0e0717" stroke-width="1.6" stroke-linejoin="round"/>
    <!-- Right Facet Base: Vibrant Amethyst -->
    <polygon points="96,70 78,118 60,94" fill="#9333ea" stroke="#0e0717" stroke-width="1.6" stroke-linejoin="round"/>

    <!-- Center Specular Razor Spine -->
    <line x1="60" y1="12" x2="60" y2="114" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>
    <polyline points="24,70 60,94 96,70" stroke="rgba(255,255,255,0.4)" stroke-width="1.4" stroke-linejoin="round"/>
  </g>
</svg>
