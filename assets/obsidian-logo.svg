<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 140" width="120" height="140" fill="none">
  <defs>
    <!-- Subtle Drop Shadow -->
    <filter id="pureIconShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="rgba(147, 51, 234, 0.35)"/>
    </filter>
  </defs>

  <g filter="url(#pureIconShadow)">
    <!-- 1. Top Point Facet (Light Lavender) -->
    <polygon
      points="60,8 90,46 60,60 30,46"
      fill="#c084fc"
      stroke="#180e29"
      stroke-width="1.8"
      stroke-linejoin="round"
    />

    <!-- 2. Mid Right Facet (Vibrant Royal Violet) -->
    <polygon
      points="90,46 104,86 60,96 60,60"
      fill="#9333ea"
      stroke="#180e29"
      stroke-width="1.8"
      stroke-linejoin="round"
    />

    <!-- 3. Mid Left Facet (Deep Amethyst Purple) -->
    <polygon
      points="30,46 60,60 60,96 16,86"
      fill="#7e22ce"
      stroke="#180e29"
      stroke-width="1.8"
      stroke-linejoin="round"
    />

    <!-- 4. Bottom Right Facet (Dark Obsidian Purple) -->
    <polygon
      points="104,86 82,120 60,130 60,96"
      fill="#4c1d95"
      stroke="#180e29"
      stroke-width="1.8"
      stroke-linejoin="round"
    />

    <!-- 5. Bottom Left Facet (Deep Midnight Obsidian) -->
    <polygon
      points="16,86 60,96 60,130 38,120"
      fill="#2e1065"
      stroke="#180e29"
      stroke-width="1.8"
      stroke-linejoin="round"
    />
  </g>
</svg>
