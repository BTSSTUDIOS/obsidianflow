<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 140" width="120" height="140" fill="none">
  <defs>
    <!-- Glowing Molten Lava Gradient -->
    <linearGradient id="spearLava" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff275"/>
      <stop offset="25%" stop-color="#ffb700"/>
      <stop offset="65%" stop-color="#ff4500"/>
      <stop offset="100%" stop-color="#c91800"/>
    </linearGradient>

    <!-- Drop Shadow / Glow -->
    <filter id="spearShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="rgba(255, 69, 0, 0.45)"/>
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="rgba(192, 132, 252, 0.35)"/>
    </filter>
  </defs>

  <g filter="url(#spearShadow)">
    <!-- Left Facet Upper: Royal Purple -->
    <polygon points="60,12 24,70 60,94" fill="#7e22ce" stroke="#0e0717" stroke-width="1.6" stroke-linejoin="round"/>
    <!-- Left Facet Base: Midnight Obsidian Purple -->
    <polygon points="24,70 42,118 60,94" fill="#4c1d95" stroke="#0e0717" stroke-width="1.6" stroke-linejoin="round"/>

    <!-- Right Facet Upper: Glowing Molten Lava -->
    <polygon points="60,12 96,70 60,94" fill="url(#spearLava)" stroke="#0e0717" stroke-width="1.6" stroke-linejoin="round"/>
    <!-- Right Facet Base: Deep Magma Crimson -->
    <polygon points="96,70 78,118 60,94" fill="#d91b00" stroke="#0e0717" stroke-width="1.6" stroke-linejoin="round"/>

    <!-- Center Specular Razor Spine -->
    <line x1="60" y1="12" x2="60" y2="114" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>
    <polyline points="24,70 60,94 96,70" stroke="rgba(255,255,255,0.4)" stroke-width="1.4" stroke-linejoin="round"/>
  </g>
</svg>
