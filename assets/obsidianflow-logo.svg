<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 140" width="120" height="140" fill="none">
  <defs>
    <!-- Molten Lava Flow Gradient -->
    <linearGradient id="lavaFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff275"/>
      <stop offset="25%" stop-color="#ffb700"/>
      <stop offset="65%" stop-color="#ff4500"/>
      <stop offset="100%" stop-color="#c91800"/>
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="iconShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="rgba(147, 51, 234, 0.4)"/>
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="rgba(255, 69, 0, 0.3)"/>
    </filter>
  </defs>

  <g filter="url(#iconShadow)">
    <!-- 1. Top Point Facet (Light Lavender) -->
    <polygon
      points="60,8 90,46 60,60 30,46"
      fill="#c084fc"
      stroke="#180e29"
      stroke-width="1.8"
      stroke-linejoin="round"
    />

    <!-- 2. Mid Right Facet (Vibrant Royal Violet) -->
    <polygon
      points="90,46 104,86 60,96 60,60"
      fill="#9333ea"
      stroke="#180e29"
      stroke-width="1.8"
      stroke-linejoin="round"
    />

    <!-- 3. Mid Left Facet (Deep Amethyst Purple) -->
    <polygon
      points="30,46 60,60 60,96 16,86"
      fill="#7e22ce"
      stroke="#180e29"
      stroke-width="1.8"
      stroke-linejoin="round"
    />

    <!-- 4. Bottom Right Facet (Dark Obsidian Purple) -->
    <polygon
      points="104,86 82,120 60,130 60,96"
      fill="#4c1d95"
      stroke="#180e29"
      stroke-width="1.8"
      stroke-linejoin="round"
    />

    <!-- 5. Bottom Left Facet: THE MOLTEN LAVA FLOW (Energy Core) -->
    <polygon
      points="16,86 60,96 60,130 38,120"
      fill="url(#lavaFacet)"
      stroke="#180e29"
      stroke-width="1.8"
      stroke-linejoin="round"
    />
  </g>
</svg>
