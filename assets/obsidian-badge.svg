<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <linearGradient id="oBadgeTable" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f3e8ff"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="oBadgeInner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6b21a8"/>
    </linearGradient>
  </defs>

  <!-- Squircle Tile -->
  <rect x="6" y="6" width="108" height="108" rx="26" fill="#090514" stroke="rgba(192, 132, 252, 0.45)" stroke-width="2.2"/>

  <!-- Centered Diamond with Clean Seams -->
  <g transform="translate(10, 10) scale(0.83)" stroke="#090514" stroke-width="1.8" stroke-linejoin="round">
    <polygon points="34,26 60,54 44,54" fill="url(#oBadgeInner)"/>
    <polygon points="34,26 12,54 44,54" fill="#7e22ce"/>
    <polygon points="12,54 44,54 60,114" fill="#4c1d95"/>
    <polygon points="44,54 60,54 60,114" fill="url(#oBadgeInner)"/>

    <polygon points="34,26 86,26 60,54" fill="url(#oBadgeTable)"/>

    <polygon points="86,26 60,54 76,54" fill="#c084fc"/>
    <polygon points="86,26 76,54 108,54" fill="#9333ea"/>
    <polygon points="60,54 76,54 60,114" fill="url(#oBadgeInner)"/>
    <polygon points="76,54 108,54 60,114" fill="#581c87"/>
  </g>
</svg>
